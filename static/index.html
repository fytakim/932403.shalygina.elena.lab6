<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды — Вариант 11</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav>
        <a href="/">Главная</a> | <a href="/about">О проекте</a>
    </nav>

    <h1>Прогноз погоды</h1>
    <div class="controls">
        <select id="city">
            <option value="moscow">Moscow</option>
            <option value="tomsk">Tomsk</option>
            <option value="london">London</option>
            <option value="unknown">Неизвестный город (тест 404)</option>
        </select>
        <input type="number" id="days" value="3" min="1" max="10">
        <button id="load-btn">Получить прогноз</button>
    </div>

    <pre id="output">Нажмите кнопку для загрузки прогноза...</pre>

    <script src="/app.js"></script>
</body>
</html>
